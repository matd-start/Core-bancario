# Infraestructura local. Uso: copia .env.example a .env y ejecuta `docker compose up -d`.
services:
  postgres:
    image: postgres:17
    container_name: core-bancario-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Keycloak (ADR-0014): emite los tokens. start-dev es solo para desarrollo local; el despliegue lo decide D-11.
  # Importa los dos realms al crear el volumen: si cambias un realm, borra el volumen (README, "Recargar un realm").
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: core-bancario-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Define KC_BOOTSTRAP_ADMIN_USERNAME en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Define KC_BOOTSTRAP_ADMIN_PASSWORD en .env}
      # Secreto de la cuenta de servicio core-bancario-api-admin (003b). El realm clientes trae un marcador con este
      # mismo nombre y Keycloak lo resuelve con esta variable al importar: el secreto no está en el repositorio.
      KC_CLIENTES_API_SECRET: ${KC_CLIENTES_API_SECRET:?Define KC_CLIENTES_API_SECRET en .env}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data/h2
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/core-bancario:/opt/keycloak/themes/core-bancario:ro
      - ./infra/keycloak/themes/core-bancario-clientes:/opt/keycloak/themes/core-bancario-clientes:ro

volumes:
  postgres-data:
  keycloak-data:
