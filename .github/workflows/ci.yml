# CI: se ejecuta en cada pull request y en cada push a main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, formato y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore

      - name: Formato (lint)
        run: dotnet format --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release -warnaserror

      # Las pruebas de integración usan Testcontainers: el runner de Ubuntu ya trae Docker.
      - name: Pruebas
        run: dotnet test --no-build --configuration Release

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
