# CI: se ejecuta en cada pull request y en cada push a main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, formato y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore

      - name: Formato (lint)
        run: dotnet format --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release -warnaserror

      # ADR-0019: compilar regenera los contratos OpenAPI (API y BFF); si cambió y no se versionó, falla.
      # git diff no ve los archivos nuevos sin versionar (así pasó OpenApi/ frente a openapi/): git status sí.
      - name: Contrato OpenAPI al día
        run: |
          git diff --exit-code -- src/CoreBancario.Api/openapi src/CoreBancario.Bff/openapi
          sin_versionar="$(git status --porcelain -- src/CoreBancario.Api/openapi src/CoreBancario.Bff/openapi)"
          if [ -n "$sin_versionar" ]; then
            echo "Contratos OpenAPI sin versionar:"
            echo "$sin_versionar"
            exit 1
          fi

      # Las pruebas de integración usan Testcontainers: el runner de Ubuntu ya trae Docker.
      - name: Pruebas
        run: dotnet test --no-build --configuration Release

  # Prueba de humo del docker-compose.yml con volúmenes nuevos, como quien clona el repo. Ninguna prueba de .NET lo
  # cubre: KeycloakFixture usa Testcontainers sin el volumen. Detecta, por ejemplo, un volumen de Keycloak montado en
  # una carpeta que no existe en la imagen: nace de root y Keycloak no puede escribir su base.
  entorno-local:
    name: Entorno local arranca
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Las variables de entorno mandan sobre .env. Los valores se generan aquí, se ocultan en el log y solo existen
      # en este job; van a GITHUB_ENV porque cada docker compose (también el de los logs) las exige.
      - name: Preparar .env
        run: |
          cp .env.example .env
          clave="$(openssl rand -hex 16)"
          secreto="$(openssl rand -hex 32)"
          secreto_web_clientes="$(openssl rand -hex 32)"
          secreto_web_empleados="$(openssl rand -hex 32)"
          echo "::add-mask::$clave"
          echo "::add-mask::$secreto"
          echo "::add-mask::$secreto_web_clientes"
          echo "::add-mask::$secreto_web_empleados"
          {
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=admin-ci"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$clave"
            echo "KC_CLIENTES_API_SECRET=$secreto"
            echo "KC_WEB_CLIENTES_SECRET=$secreto_web_clientes"
            echo "KC_WEB_EMPLEADOS_SECRET=$secreto_web_empleados"
          } >> "$GITHUB_ENV"

      - name: Levantar PostgreSQL y Keycloak
        run: docker compose up -d --wait

      - name: Esperar a que Keycloak importe los realms
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/realms/clientes/.well-known/openid-configuration > /dev/null &&
               curl -sf http://localhost:8080/realms/empleados/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak arrancó e importó los realms."
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak no respondió en 5 minutos."
          exit 1

      # T10 (RNF-16): la API y el BFF, construidos desde sus Dockerfiles y sin puertos publicados. Solo se pueden alcanzar
      # desde un contenedor de la red de compose: la API responde /health y el BFF, sin sesión, responde 401.
      - name: Levantar la API y el BFF (perfil app)
        run: docker compose --profile app up -d --build --wait

      - name: Comprobar la API y el BFF desde la red de compose
        run: |
          red="$(docker inspect -f '{{range $nombre, $_ := .NetworkSettings.Networks}}{{$nombre}}{{end}}' core-bancario-api)"
          estado() { docker run --rm --network "$red" curlimages/curl:8.11.1 -s -o /dev/null -w '%{http_code}' "$@"; }
          for i in $(seq 1 30); do
            api="$(estado http://api:8080/health || true)"
            bff="$(estado -H 'X-CSRF: 1' http://bff:8080/bff/sesion || true)"
            if [ "$api" = "200" ] && [ "$bff" = "401" ]; then
              echo "La API responde 200 en /health y el BFF responde 401 sin sesión."
              exit 0
            fi
            sleep 5
          done
          echo "La API o el BFF no respondieron como se esperaba (API: $api, BFF: $bff)."
          exit 1

      - name: Logs de los contenedores
        if: failure()
        run: docker compose --profile app logs

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
